<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:url" content="https://invigitales.github.io/W-A/">
    <meta property="og:type" content="website">


    <title>Invitación</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="invitacion">

        <!-- W&A-02 -->
        <section class="seccion">
            <img src="imagenes/W&A-02.png" alt="Invitación - Sección 2" class="img-boda">
        </section>

        <!-- W&A-03 -->
        <section class="seccion">
            <img src="imagenes/W&A-03.png" alt="Invitación - Sección 3" class="img-boda">
        </section>

        <!-- W&A-04 -->
        <section class="seccion">
            <img src="imagenes/W&A-04.png" alt="Invitación - Sección 4" class="img-boda">
        </section>

        <!-- W&A-05 + CUENTA REGRESIVA -->
        <section class="seccion">
            <img src="imagenes/W&A-05.png" alt="Invitación - Sección 5" class="img-boda">

            <div class="cuenta-regresiva">
                <h2>Faltan</h2>

                <div class="countdown-row">

                    <div class="time-block">
                        <span id="days" class="number">00</span>
                        <span class="unit">días</span>
                    </div>

                    <div class="time-block">
                        <span id="hours" class="number">00</span>
                        <span class="unit">hs</span>
                    </div>

                    <div class="time-block">
                        <span id="minutes" class="number">00</span>
                        <span class="unit">min</span>
                    </div>

                    <div class="time-block">
                        <span id="seconds" class="number">00</span>
                        <span class="unit">seg</span>
                    </div>

                </div>
            </div>
        </section>

        <!-- W&A-06 -->
        <section class="seccion">
            <img src="imagenes/W&A-06.png" alt="Invitación - Sección 6" class="img-boda">
        </section>

        <!-- W&A-07 + BOTÓN 1 -->
        <section class="seccion">
            <img src="imagenes/W&A-07.png" alt="Invitación - Sección 7" class="img-boda">

            <!-- BOTÓN 1 -->
            <a href="AQUI_VA_EL_LINK_1" target="_blank" class="btn-sobrepuesto btn1">
                <img src="imagenes/btn1.png" alt="Botón 1">
            </a>
        </section>

        <!-- W&A-08 + BOTÓN 2 -->
        <section class="seccion">
            <img src="imagenes/W&A-08.png" alt="Invitación - Sección 8" class="img-boda">

            <!-- BOTÓN 2 -->
            <a href="AQUI_VA_EL_LINK_2" target="_blank" class="btn-sobrepuesto btn2">
                <img src="imagenes/btn2.png" alt="Botón 2">
            </a>
        </section>

        <!-- W&A-09 -->
        <section class="seccion">
            <img src="imagenes/W&A-09.png" alt="Invitación - Sección 9" class="img-boda">
        </section>

        <!-- W&A-10 + BOTÓN 3 -->
        <section class="seccion">
            <img src="imagenes/W&A-10.png" alt="Invitación - Sección 10" class="img-boda">

            <!-- BOTÓN 3 -->
            <a href="AQUI_VA_EL_LINK_3" target="_blank" class="btn-sobrepuesto btn3">
                <img src="imagenes/btn3.png" alt="Botón 3">
            </a>
        </section>

        <!-- W&A-11 -->
        <section class="seccion">
            <img src="imagenes/W&A-11.png" alt="Invitación - Sección 11" class="img-boda">
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
